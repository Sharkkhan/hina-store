<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | HINA</title>
<meta name="description" content="Contact HINA about sizing, shipping, or your order.">
<link rel="canonical" href="https://www.shophinas.com/contact.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231A1A1F'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='42' text-anchor='middle' fill='%23E4CE9A'%3EH%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Jost:wght@300;400;500&display=swap">
<style>
:root { --bg: #ECE8E1; --surface: #F5F2EC; --fg: #1A1A1F; --muted: #66625A; --line: rgba(26,26,31,.14); --accent: #8C6A2F; }
* { box-sizing: border-box; margin: 0; }
body { font-family: "Jost", "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.6; }
.wrap { max-width: 720px; margin: 0 auto; padding: 64px 24px; }
h1 { font-family: "Gilda Display", Georgia, serif; font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 16px; }
.lede { color: var(--muted); margin-bottom: 32px; }
form label { display: block; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 500; margin-bottom: 16px; }
input, textarea { display: block; width: 100%; margin-top: 8px; padding: 12px 14px; font: inherit; font-size: 1rem; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }
textarea { resize: vertical; min-height: 120px; }
.btn { display: inline-block; padding: 14px 32px; font: inherit; font-size: .82rem; letter-spacing: .18em; text-transform: uppercase; background: var(--fg); color: var(--bg); border: none; border-radius: 4px; cursor: pointer; }
.btn:disabled { opacity: .6; cursor: default; }
.err { color: #b3261e; font-size: .9rem; margin: 0 0 12px; }
.okmsg { color: #1a7f37; font-size: .9rem; margin: 0 0 12px; }
.back { display: inline-block; margin-top: 40px; color: var(--accent); text-decoration: none; font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; }
.draft { display: inline-block; margin-top: 24px; padding: 6px 14px; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; background: #fff3cd; color: #856404; border: 1px solid #ffeeba; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Contact</h1>
  <p class="lede">Questions about sizing, shipping, or your order? Send a message and we will get back to you.</p>
  <span class="draft">Draft, pending review</span>
  <form id="contactForm" novalidate style="margin-top:24px">
    <label>Your name<input type="text" id="cfName" required autocomplete="name"></label>
    <label>Your email<input type="email" id="cfEmail" required autocomplete="email"></label>
    <label>Message<textarea id="cfMsg" rows="5" required></textarea></label>
    <p class="err" id="cfErr" hidden></p>
    <p class="okmsg" id="cfOk" hidden>Message sent. We will reply soon.</p>
    <button class="btn" type="submit" id="cfSend"><span id="cfSendLbl">Send message</span></button>
  </form>
  <a class="back" href="/">Back to the store</a>
</div>
<script>
(function () {
  var form = document.getElementById("contactForm");
  var sendBtn = document.getElementById("cfSend"), sendLbl = document.getElementById("cfSendLbl");
  var err = document.getElementById("cfErr"), ok = document.getElementById("cfOk");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    err.hidden = true; ok.hidden = true;
    var name = document.getElementById("cfName").value.trim();
    var email = document.getElementById("cfEmail").value.trim();
    var message = document.getElementById("cfMsg").value.trim();
    function fail(msg) { err.textContent = msg; err.hidden = false; sendBtn.disabled = false; sendLbl.textContent = "Send message"; }
    if (!name) return fail("Please enter your name.");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail("Please enter a valid email address.");
    if (!message) return fail("Please enter a message.");
    sendBtn.disabled = true; sendLbl.textContent = "Sending";
    fetch("/api/contact", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, email: email, message: message })
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, j: j }; }, function () { return { ok: false, j: {} }; });
    }).then(function (res) {
      if (res.ok && res.j && res.j.ok) {
        ok.hidden = false; form.reset(); sendBtn.disabled = false; sendLbl.textContent = "Send message";
      } else {
        fail(res.j && res.j.error ? res.j.error : "We could not send your message. Please try again.");
      }
    }).catch(function () { fail("We could not send your message. Please try again."); });
  });
})();
</script>
</body>
</html>
